<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>💰 Expense Tracker</h1>
        <button id="darkBtn">🌙 Dark</button>
    </header>

    <div class="summary">
        <div>Total<br><b id="total">0 Birr</b></div>
        <div>Expenses<br><b id="count">0</b></div>
        <div>Highest<br><b id="highest">0 Birr</b></div>
        <div>Lowest<br><b id="lowest">0 Birr</b></div>
        <div>Average<br><b id="average">0 Birr</b></div>
    </div>

    <div class="box">
        <h2>Add Expense</h2>

        <form id="form">
            <input id="name" placeholder="Expense name">
            <input id="amount" type="number" placeholder="Amount">

            <select id="category">
                <option value="">Category</option>
                <option>Food</option>
                <option>Transport</option>
                <option>Shopping</option>
                <option>Entertainment</option>
                <option>Other</option>
            </select>

            <input id="date" type="date">

            <button>Add Expense</button>
        </form>

        <p id="error"></p>
    </div>

    <div class="tools">
        <input id="search" placeholder="🔍 Search...">

        <select id="filter">
            <option>All</option>
            <option>Food</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Entertainment</option>
            <option>Other</option>
        </select>

        <input id="month" type="month">
    </div>

    <div class="box">
        <h2>Expense History</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="list"></tbody>
        </table>

        <p id="empty">No expenses added yet.</p>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
